general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 10 minutes → dim to 30% gamma
listener {
    timeout    = 600
    on-timeout = hyprsunset -g 30 &
    on-resume  = pkill hyprsunset || true
}

# 15 minutes → lock screen
listener {
    timeout    = 900
    on-timeout = pidof hyprlock || hyprlock
}

# 20 minutes → monitors off
listener {
    timeout    = 1200
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on; pkill hyprsunset || true
}
